; =============================================================================
;  RCLC D15 Engine Simulator - firmware for the RCLC D15 board (ESP32-S3)
; =============================================================================
;   pio run                      build
;   pio run -t upload            build + flash (add --upload-port COMx if needed)
;   pio device monitor           serial console at 115200
;
;  Target: Freenove ESP32-S3-WROOM Lite, part marking MCN16R8
;          = 16 MB flash + 8 MB OCTAL PSRAM.
;  The octal part matters: memory_type must be qio_opi, not the qio_qspi that
;  the generic S3 board files assume. Get it wrong and ps_malloc returns null,
;  which on this firmware means the sound pack silently refuses to load.
; =============================================================================

[platformio]
src_dir = src

[env:rclc_d15]
platform  = espressif32@6.4.0          ; Arduino core 2.0.11, already installed
board     = esp32-s3-devkitc-1
framework = arduino

board_build.mcu             = esp32s3
board_build.arduino.memory_type = qio_opi      ; 16MB QIO flash + 8MB OPI PSRAM
board_upload.flash_size     = 16MB
board_upload.maximum_size   = 16777216
board_build.partitions      = huge_app.csv     ; sim + packs, no OTA needed

build_flags =
    -DBOARD_HAS_PSRAM
    ; Serial goes out the Freenove's CH343 bridge (UART0, GPIO43/44) - the port
    ; Windows enumerates as a CH343 (VID_1A86 PID_55D3) and the one you flash on.
    ; Setting ARDUINO_USB_CDC_ON_BOOT=1 instead routes Serial to the S3's NATIVE
    ; USB on GPIO19/20, which is a DIFFERENT physical socket: the firmware runs
    ; fine but prints nothing to the cable you are holding. Cost a debug cycle.
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=1
    -O2

; packs src/WebPage.h -> src/WebAssets.h (gzipped page + /img files) before each build
extra_scripts = pre:tools/pack_web.py

; upload_port = COM5      ; set yours, or let PlatformIO find it
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder

